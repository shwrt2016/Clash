# Clash Verge「DNS 覆盖」配置
# 国内域名走国内 DNS，国外域名走 Cloudflare，Claude DNS 强制走 SG-Team

dns:
  default-nameserver:
  - https://1.1.1.1/dns-query
  - https://1.0.0.1/dns-query
  direct-nameserver:
  - 'https://223.5.5.5/dns-query#DIRECT'
  - 'https://1.12.12.12/dns-query#DIRECT'
  direct-nameserver-follow-policy: false
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - your-proxy.example.com
  - '*.your-proxy.example.com'
  - netbird.io
  - '*.netbird.io'
  - wiretrustee.com
  - '*.wiretrustee.com'
  - claude.com
  - '*.claude.com'
  - clau.de
  - '*.clau.de'
  - claudemcpclient.com
  - '*.claudemcpclient.com'
  - claudemcpcontent.com
  - '*.claudemcpcontent.com'
  - claudeusercontent.com
  - '*.claudeusercontent.com'
  - claude.ai
  - '*.claude.ai'
  - anthropic.com
  - '*.anthropic.com'
  - sentry.io
  - '*.sentry.io'
  - statsigapi.net
  - '*.statsigapi.net'
  - intercom.io
  - '*.intercom.io'
  - intercomcdn.com
  - '*.intercomcdn.com'
  - servd-anthropic-website.b-cdn.net
  - anthropic.com.cdn.cloudflare.net
  - anthropic.auth0.com
  - anthropic-com.ghost.io
  - browser-intake-us5-datadoghq.com
  - cdn.usefathom.com
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - 'time.*.com'
  - 'ntp.*.com'
  - '+.market.xiaomi.com'
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fallback: []
  fallback-filter:
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  ipv6: false
  listen: :53
  nameserver:
  - 'https://1.1.1.1/dns-query#RULES'
  - 'https://1.0.0.1/dns-query#RULES'
  nameserver-policy:
    +.your-proxy.example.com:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    +.netbird.io:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    +.wiretrustee.com:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    +.apple.com:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    +.icloud.com:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    geosite:cn:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
    geosite:geolocation-!cn:
    - 'https://1.1.1.1/dns-query#RULES'
    - 'https://1.0.0.1/dns-query#RULES'
    +.anthropic.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.claude.ai:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.claude.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.clau.de:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.claudemcpclient.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.claudemcpcontent.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.claudeusercontent.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.sentry.io:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.statsigapi.net:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.intercom.io:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    +.intercomcdn.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    servd-anthropic-website.b-cdn.net:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    anthropic.com.cdn.cloudflare.net:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    anthropic.auth0.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    anthropic-com.ghost.io:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    browser-intake-us5-datadoghq.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    cdn.usefathom.com:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
    geosite:anthropic:
    - 'https://1.1.1.1/dns-query#SG-Team'
    - 'https://1.0.0.1/dns-query#SG-Team'
  prefer-h3: false
  proxy-server-nameserver:
  - 'https://223.5.5.5/dns-query#DIRECT'
  - 'https://1.12.12.12/dns-query#DIRECT'
  - 'tls://223.5.5.5#DIRECT'
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
